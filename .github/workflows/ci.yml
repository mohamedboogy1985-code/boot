name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Plain install MUST work without --legacy-peer-deps (regression guard
      # for the esbuild/vite-8 ERESOLVE and the missing react-is peer).
      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Critical-path smoke tests
        run: npm test
